# Publishes the game to rapid: every push to stable, and any branch or PR on
# request.
name: Rapid build
on:
  push:
    branches:
      # Upstream this is "stable". Renamed while we test on the fork.
      - claude/testing-stable
  workflow_dispatch:
    inputs:
      ref:
        description: PR number or branch name to build
        required: true
        type: string
jobs:
  build:
    # A fork publishes nothing on push, its maintainers still dispatch builds.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'p2004a/Beyond-All-Reason'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: p2004a/Beyond-All-Reason/.github/actions/rapid-build@master
        with:
          url: https://t1.qwer.foo/build
          repo: byar
          ref: ${{ inputs.ref }}
          branch: ${{ github.event_name == 'push' && 'test' || '' }}
